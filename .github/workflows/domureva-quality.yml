name: Domureva quality gates

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "DESIGN.md"
      - ".github/workflows/domureva-quality.yml"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Unit tests, typecheck, build and incremental lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
      - name: Production build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_SUPABASE_PROJECT_ID: domureva-ci
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci_build_placeholder_only
      - name: Typecheck (after TanStack generated routes)
        run: bunx tsc --noEmit
      - name: Incremental lint (repository-wide formatting debt is tracked separately)
        shell: bash
        run: |
          git fetch --no-tags origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD -- src tests | grep -E '\.(ts|tsx)$' || true)
          if (( ${#changed[@]} > 0 )); then
            bunx eslint --rule "prettier/prettier: off" "${changed[@]}"
          else
            echo "No changed TypeScript sources to lint."
          fi
