name: Domureva quality gates

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "DESIGN.md"
      - ".github/workflows/domureva-quality.yml"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_SUPABASE_PROJECT_ID: domureva-ci
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci_build_placeholder_only
